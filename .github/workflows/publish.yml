# Manual publish: Actions → Publish to npm → Run workflow
# Auth: npm trusted publishing (OIDC). No NPM_TOKEN secret. The package's
# npmjs.com settings must list this repo + workflow file (publish.yml) as a
# trusted publisher. Requires npm >= 11.5.1, hence Node 24.
# Note: Bump version in package.json locally after publishing if you want repo in sync
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Bump version
        run: |
          npm version "${{ github.event.inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Remove private for publish
        run: npm pkg delete private || true

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public

